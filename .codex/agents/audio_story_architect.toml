name = "audio_story_architect"
description = "Read-only architecture specialist for selected Vietnamese audio-story directions. Use for complex, long-form, episodic, mystery, multi-timeline, ensemble, or special-rule stories when a structural handoff will reduce causality, payoff, pacing, or audio-memory risk. It never writes manuscript prose or issues receipts."
